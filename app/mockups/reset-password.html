<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/mockup.css">
  <style>
    .brand-inline .brand-name { font-family: var(--font-display); font-weight: 300; font-size: 22px; color: var(--ink); }
    .auth-foot a:hover { color: var(--ink); }
  </style>
</head>
<body class="auth">
<div class="auth-shell">
  <div class="auth-form-side">
    <a class="brand-inline" href="login.html"><span class="brand-orb"></span><span class="brand-name">Voice Agent</span></a>
    <div class="auth-form-wrap">
      <form class="auth-form" onsubmit="return false">
        <div>
          <h1>Choose a new password</h1>
          <p class="lede">Pick something you have not used before. You will be logged out of your other devices.</p>
        </div>
        <div class="field">
          <label class="label" for="pw">New password</label>
          <div class="input-suffix">
            <input class="input" id="pw" type="password" data-reveal value="Athens-2026-calls" autocomplete="new-password">
            <button class="btn btn-sm btn-text" type="button" data-reveal-btn>Show</button>
          </div>
          <div class="pw-meter" aria-hidden="true"><span class="on"></span><span class="on"></span><span class="on"></span><span></span></div>
        </div>
        <div class="field has-error">
          <label class="label" for="pw2">Confirm new password</label>
          <input class="input" id="pw2" type="password" value="Athens-2026-call">
          <span class="hint row-sm"><i data-icon="circle-alert" data-size="sm"></i>Passwords do not match.</span>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" onclick="location.href='login.html'">Update password</button>
        <p class="small muted center"><a class="link" href="login.html">Back to log in</a></p>
      </form>
    </div>
    <div class="auth-foot"><span>© 2026 Voice Agent</span><a href="#">Privacy</a><a href="#">Terms</a></div>
  </div>

  <aside class="auth-art" aria-hidden="true">
    <span class="orb orb-lavender" style="width:440px;height:440px;left:-110px;top:-80px"></span>
    <span class="orb orb-peach" style="width:420px;height:420px;right:-100px;top:28%"></span>
    <span class="orb orb-mint" style="width:340px;height:340px;left:10%;bottom:-130px"></span>
    <h2>A fresh start.</h2>
    <p>Your agents, knowledge and call history are exactly as you left them.</p>
  </aside>
</div>
<script src="assets/icons.js"></script>
<script src="assets/mockup.js"></script>
</body>
</html>
